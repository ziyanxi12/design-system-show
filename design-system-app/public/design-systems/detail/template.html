/* 每个栏目单独渲染：数据有问题的栏目显示原因，不影响其他栏目 */
const TOKEN_KEYS={color:"color",typography:"typography",spacing:"spacing",radius:"radius",shadow:"shadow"};
function why(k){const E=D.err;if(k==="overview")return E.design&&`${res(DS.overview||"")} 读取失败：${E.design}`;
 if(k==="components"||k==="patterns")return null; /* 空/缺由 R 的空态处理 */
 const c=TOKEN_KEYS[k];if(!c)return null;
 const x=T[c];if(!x||typeof x!=="object")return `design-system.json 里没有「${c}」这一部分`;
 if(!Array.isArray(x.groups))return `design-system.json 里「${c}」缺少 groups 字段${x.group!==undefined?"（现在写成了 group）":""}`;
 const i=x.groups.findIndex(g=>!g||!Array.isArray(g.tokens));if(i>=0)return `design-system.json 里「${c}」的第 ${i+1} 组缺少 tokens 字段${x.groups[i]&&x.groups[i].token!==undefined?"（现在写成了 token）":""}`;
 return null}
function draw(k){const box=$("#sec-"+k);if(!box)return;const s=SECTIONS.find(x=>x[0]===k);const fail=m=>{box.innerHTML=shell(k,s[1],"")+`<div class="ct-empty ds-sec-fail"><b>这一栏的数据无法解析，暂不显示<\/b><span>${esc(m)}<\/span><span>其他栏目不受影响；改好数据后刷新页面即可。<\/span><\/div>`};
 const m=why(k);if(m)return fail(m);try{R[k](box)}catch(e){console.error(k,e);fail(`渲染时出错：${e.message}`)}}
SECTIONS.forEach(([k])=>draw(k));
redrawHook=()=>draw("components");
main.addEventListener("click",e=>{const b=e.target.closest("[data-sc] [data-i]");if(b){const k=b.parentNode.dataset.sc;ui.sc[k]=Number(b.dataset.i);draw(k)}
 const c=e.target.closest("[data-copy]");if(c&&navigator.clipboard)navigator.clipboard.writeText(c.dataset.copy).catch(()=>{})});
const off=el=>el.getBoundingClientRect().top-main.getBoundingClientRect().top+main.scrollTop;
function setNav(k){$$(".dsd-nav [data-sec]").forEach(b=>b.classList.toggle("on",b.dataset.sec===k))}
function go(k,smooth){const c=$("#sec-"+k);if(!c)return;setNav(k);main.dataset.lock=1;main.scrollTo({top:off(c),behavior:smooth?"smooth":"auto"});clearTimeout(main._u);main._u=setTimeout(()=>delete main.dataset.lock,smooth?700:50);try{history.replaceState(null,"","#"+k)}catch(e){}}
$(".dsd-nav").onclick=e=>{const t=e.target.closest("[data-toggle-sub]");if(t){t.closest(".nav-grp").classList.toggle("open");return}
 const cc=e.target.closest("[data-ccat]");if(cc){const o=cc.getAttribute("aria-expanded")==="true";cc.setAttribute("aria-expanded",String(!o));cc.nextElementSibling.hidden=o;return}
 const j=e.target.closest("[data-jump]");if(j){const r=document.getElementById(j.dataset.jump);$$(".dsd-sub button").forEach(b=>b.classList.toggle("on",b===j));setNav(null);if(r){main.dataset.lock=1;main.scrollTo({top:off(r)-24,behavior:"smooth"});setTimeout(()=>delete main.dataset.lock,700)}return}
 const b=e.target.closest("[data-sec]");if(b){if(b.closest(".nav-grp"))b.closest(".nav-grp").classList.add("open");go(b.dataset.sec,true)}};
main.onscroll=()=>{if(main.dataset.lock)return;const top=main.scrollTop+80;let cur=SECTIONS[0][0];SECTIONS.forEach(([k])=>{if(off($("#sec-"+k))<=top)cur=k});setNav(cur)};
 $$(".cp-frame").forEach(f=>{f.addEventListener("load",()=>live(f));live(f)});
 /* 编辑模式：动态加载向导 + 编辑弹窗逻辑（查看路由零开销） */
  if(EDIT)import("./edit-mode.js").then(m=>m.editSetup({slug:SLUG,components:D.components,erows:EROWS,applyErows:rows=>{setErows(rows);draw("components")},redraw:()=>draw("components"),main,esc,icon,res,apiBase:API_BASE_STR})).catch(e=>console.warn("[edit] edit-mode:",e));
 const h=location.hash.slice(1);go(SECTIONS.some(s=>s[0]===h)?h:"overview",false);
 }

/* ---- boot（v4.4）：宿主 ds-ready 握手 → ds-data 注入 jsonUrl → 直接 fetch design-system.json；
        独立模式（直接打开 / 预览.command）读同目录 data/design-system.json。 ---- */
const failPage=(title,detail)=>{$("#app").innerHTML=`<div class="ds-fail"><b>${title}<\/b><p>${detail}<\/p><\/div>`};
window.addEventListener("message",e=>{if(window.parent===window||e.source!==window.parent)return;const d=e.data;if(!d)return;
 if(d.type==="ds-edit-on"&&!EDIT_ON){EDIT_ON=true;if(redrawHook)redrawHook()}
 else if(d.type==="ds-edit-off"&&EDIT_ON){EDIT_ON=false;if(redrawHook)redrawHook()}});
if(window.parent!==window){
 window.parent.postMessage({type:"ds-ready"},"*");
 let booted=false;
 window.addEventListener("message",e=>{
   const d=e.data;if(booted||!d||d.type!=="ds-data")return;
   const meta=(d.data||{}).meta||{};
   EDIT=!!(d.data||{}).edit;SLUG=String((d.data||{}).id||"");API_BASE_STR=String((d.data||{}).apiBase||"");
  if(!meta.jsonUrl){failPage("缺少数据源 jsonUrl","本页需由设计系统展示端打开（数据由展示端经 api1 的 json_url 注入），请从展示端列表进入。");return}
  const s=String(meta.jsonUrl),i=s.lastIndexOf("/");
  if(/^(blob:|data:)/i.test(s)||i<1){failPage("数据源地址无法解析","jsonUrl："+esc(meta.jsonUrl));return}
  booted=true;
  json(meta.jsonUrl).then(ds=>{if(!ds||typeof ds!=="object")throw new Error("顶层不是 JSON 对象");
   DS=ds;BASE=s.slice(0,i+1);run()},err=>failPage("design-system.json 读取失败",esc(err.message)))});
}else{
 BASE="data/";
 json("data/design-system.json").then(ds=>{if(!ds||typeof ds!=="object")throw new Error("顶层不是 JSON 对象");
  DS=ds;run()},err=>{const file=location.protocol==="file:";
  failPage(file?"请双击「预览.command」打开本网站":"数据读取失败",file?"直接双击 index.html 打开时，浏览器不允许页面读取本地的 data 文件夹。请双击同目录下的 <code>预览.command</code>，它会在本机启动预览并自动打开浏览器。":esc(err.message))});
}
})();
</script>
</body></html>
