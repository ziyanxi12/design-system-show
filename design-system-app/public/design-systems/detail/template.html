<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HarmonyOS PC 客户端规范 · 设计系统</title>
<style>/* 基础与外壳：顶部导航 + 左侧菜单（按 Pixso 4:3677 等稿件还原） */


:root {
  --brand: #0A59F7;
  --brand-08: rgba(10, 89, 247, 0.08);
  --brand-12: rgba(10, 89, 247, 0.12);
  --text-1: rgba(0, 0, 0, 0.9);
  --text-2: rgba(0, 0, 0, 0.6);
  --text-3: rgba(0, 0, 0, 0.4);
  --text-primary: #191919;
  --text-secondary: #777777;
  --fill-1: rgba(0, 0, 0, 0.05);
  --fill-3: rgba(0, 0, 0, 0.03);
  --border-1: rgba(0, 0, 0, 0.1);
  --bg-page: #F3F4F6;
  --shadow-card: 0 1px 6px 0 rgba(0, 0, 0, 0.078);
  --shadow-pop: 0 8px 24px rgba(0, 0, 0, 0.12), 0 0 1px rgba(0, 0, 0, 0.2);
  --font: "HarmonyOS Sans SC", "HarmonyOS Sans", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --topbar-h: 48px;
  --sidebar-w: 296px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  font-size: 14px;
  line-height: 22px;
  color: var(--text-1);
  background: #fff;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input, textarea { font: inherit; color: inherit; border: 0; outline: 0; background: none; }
img { display: block; }
ul { list-style: none; }

.ic { display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px; flex-shrink: 0; }
.ic svg { width: 14px; height: 14px; display: block; }
.ic.s16 { width: 16px; height: 16px; }
.ic.s14 { width: 14px; height: 14px; }
.ic.s12 { width: 12px; height: 12px; }
.ic.s24 { width: 24px; height: 24px; }

/* ---------- App 框架 ---------- */
.app { position: relative; width: 100vw; height: 100vh; min-width: 1280px; overflow: hidden; }

.topbar {
  position: absolute; left: 0; top: 0; right: 0; height: var(--topbar-h); z-index: 20;
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 24px; background: #fff; border-bottom: 1px solid var(--border-1);
}
.topbar-left { display: flex; align-items: center; gap: 24px; width: 330px; }
.traffic { display: flex; gap: 8px; }
.traffic i { width: 12px; height: 12px; border-radius: 50%; display: block; }
.traffic i:nth-child(1) { background: #FF5F57; }
.traffic i:nth-child(2) { background: #FEBC2E; }
.traffic i:nth-child(3) { background: #28C840; }
.brand-logo { height: 20px; }
.seg {
  display: flex; gap: 4px; padding: 2px; border-radius: 999px; background: var(--fill-1);
}
.seg-item {
  width: 106px; height: 28px; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 4px;
  color: var(--text-2); font-size: 14px; line-height: 22px; transition: background .15s, color .15s;
}
.seg-item .ic { width: 18px; height: 18px; }
.seg-item:hover { color: var(--text-1); }
.seg-item.active { background: #fff; color: var(--brand); font-weight: 500; box-shadow: var(--shadow-card); }
.topbar-right { width: 330px; display: flex; justify-content: flex-end; align-items: center; gap: 20px; }
.topbar-right .ic { width: 24px; height: 24px; color: #191919; cursor: pointer; }
.avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }

/* ---------- 左侧菜单 ---------- */
.sidebar {
  position: absolute; left: 0; top: var(--topbar-h); bottom: 0; width: var(--sidebar-w); z-index: 10;
  border-right: 1px solid var(--border-1); background: #fff; overflow: hidden;
  display: flex; flex-direction: column;
}
.sidebar::before {
  content: ""; position: absolute; left: -315px; top: -81px; width: 925px; height: 1113px; z-index: 0;
  background: none center / cover no-repeat; filter: blur(20px);
  -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,0) 0, rgba(0,0,0,0) 405px, rgba(0,0,0,.1) 417px, rgba(0,0,0,.2) 950px, rgba(0,0,0,.5) 1113px);
  mask-image: linear-gradient(180deg, rgba(0,0,0,0) 0, rgba(0,0,0,0) 405px, rgba(0,0,0,.1) 417px, rgba(0,0,0,.2) 950px, rgba(0,0,0,.5) 1113px);
  pointer-events: none;
}
.sidebar > * { position: relative; z-index: 1; }
.sb-top { padding: 12px 12px 0; }
.project-card {
  height: 70px; border-radius: 12px; background: var(--fill-3); padding: 12px; display: flex; align-items: center; gap: 12px; cursor: pointer;
}
.project-card:hover { background: var(--fill-1); }
.project-card .ic { width: 20px; height: 20px; color: #000; }
.project-card .ic svg { width: 16px; height: 18px; }
.pc-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.pc-title { display: flex; align-items: center; justify-content: space-between; font-weight: 500; color: var(--text-1); }
.pc-title .ic { width: 16px; height: 16px; color: var(--text-1); }
.pc-title .ic svg { width: 6px; height: 11px; }
.pc-meta { display: flex; align-items: center; gap: 8px; font-size: 12px; line-height: 20px; color: var(--text-2); }
.pc-meta i { width: 1px; height: 10px; background: var(--border-1); }

.sb-row {
  height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 8px; cursor: pointer;
  color: var(--text-primary); position: relative; white-space: nowrap;
}
.sb-row:hover { background: var(--fill-1); }
.sb-row .ic { color: #000; }
.sb-row .ic svg { width: 16px; height: 16px; }
.sb-row .label { overflow: hidden; text-overflow: ellipsis; }
.sb-row.child { padding-left: 40px; }
.sb-row.active { background: var(--brand-08); color: var(--brand); }
.sb-row.active .ic { color: var(--brand); }
.sb-row.active::after {
  content: ""; position: absolute; right: 8px; top: 2px; width: 4px; height: 32px; border-radius: 2px; background: var(--brand);
}
.sb-new { margin-top: 12px; }
.sb-new .ic svg { width: 20px; height: 20px; }
.sb-divider { height: 1px; background: var(--border-1); margin: 8px 0; }
.sb-scroll { flex: 1; overflow-y: auto; padding: 0 12px; scrollbar-width: none; }
.sb-scroll::-webkit-scrollbar { display: none; }
.sb-group-head {
  height: 36px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px;
  font-size: 12px; color: var(--text-secondary);
}
.sb-group-head .toggle { display: flex; align-items: center; gap: 4px; cursor: pointer; }
.sb-group-head .toggle .ic { width: 12px; height: 12px; color: var(--text-secondary); transition: transform .15s; }
.sb-group-head .toggle .ic svg { width: 9px; height: 5px; }
.sb-group-head.collapsed .toggle .ic { transform: rotate(-90deg); }
.sb-group-head .add { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; border-radius: 4px; color: var(--text-secondary); }
.sb-group-head .add:hover { background: var(--fill-1); }
.sb-group-head .add svg { width: 11px; height: 11px; }
.sb-folder .ic svg { width: 20px; height: 20px; }
.sb-row.fresh { animation: fresh 1.6s ease; }
@keyframes fresh { 0% { background: var(--brand-12); } 100% { background: var(--brand-08); } }
.sb-bottom { padding: 12px 12px 24px; }
.sb-bottom .sb-row .ic svg { width: 17px; height: 17px; }

/* ---------- 主区 ---------- */
.main { position: absolute; left: var(--sidebar-w); top: var(--topbar-h); right: 0; bottom: 0; overflow: hidden; background: #fff; }
.view { position: absolute; inset: 0; overflow: auto; }

/* ---------- 通用控件 ---------- */
.btn {
  height: 32px; padding: 0 16px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font-size: 14px; white-space: nowrap; transition: background .15s, opacity .15s;
}
.btn .ic { width: 16px; height: 16px; }
.btn-primary { background: var(--brand); color: #fff; font-weight: 500; }
.btn-primary:hover { background: #0B4FD8; }
.btn-ghost { background: var(--fill-1); color: var(--text-1); }
.btn-ghost:hover { background: rgba(0, 0, 0, 0.08); }
.btn-text { color: var(--text-1); padding: 0 8px; }
.btn-text:hover { background: var(--fill-1); }
.btn[disabled] { opacity: .4; pointer-events: none; }
.icon-btn { width: 32px; height: 32px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; color: var(--text-1); }
.icon-btn:hover { background: var(--fill-1); }

.menu {
  position: fixed; z-index: 100; min-width: 160px; padding: 4px; background: #fff; border-radius: 12px; box-shadow: var(--shadow-pop);
  animation: pop .12s ease-out;
}
@keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(.98); } to { opacity: 1; transform: none; } }
.menu-item {
  height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 8px; cursor: pointer; white-space: nowrap; color: var(--text-1);
}
.menu-item:hover { background: var(--fill-1); }
.menu-item .ic { width: 16px; height: 16px; color: var(--text-2); }
.menu-item.danger { color: #E84026; }
.menu-item.danger .ic { color: #E84026; }
.menu-item .check { margin-left: auto; color: var(--brand); }
.menu-item.selected { color: var(--brand); }
.menu-sep { height: 1px; background: var(--border-1); margin: 4px 8px; }
.menu-title { padding: 8px 12px 4px; font-size: 12px; color: var(--text-secondary); }

.toast-wrap { position: fixed; left: 50%; top: 72px; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast {
  display: flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px; background: rgba(25, 25, 25, .92); color: #fff; font-size: 14px;
  box-shadow: 0 6px 20px rgba(0,0,0,.18); animation: toastIn .2s ease-out;
}
.toast .ic { width: 16px; height: 16px; color: #4FD1A5; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

.mask { position: fixed; inset: 0; z-index: 150; background: rgba(0, 0, 0, .32); display: flex; align-items: center; justify-content: center; animation: fade .15s; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.modal { width: 640px; max-height: 86vh; background: #fff; border-radius: 24px; box-shadow: 0 16px 48px rgba(0,0,0,.18); display: flex; flex-direction: column; overflow: hidden; animation: pop .18s ease-out; }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 24px 24px 8px; }
.modal-head h3 { font-size: 20px; line-height: 28px; font-weight: 700; color: var(--text-primary); }
.modal-body { padding: 8px 24px 24px; overflow: auto; }
.modal-foot { display: flex; justify-content: flex-end; gap: 12px; padding: 16px 24px 24px; }

.drawer-mask { position: fixed; inset: 0; z-index: 140; background: rgba(0,0,0,.2); animation: fade .15s; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: 720px; z-index: 141; background: #fff; box-shadow: -8px 0 32px rgba(0,0,0,.12);
  display: flex; flex-direction: column; animation: slideIn .22s ease-out;
}
@keyframes slideIn { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }

.tag { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border-radius: 4px; font-size: 12px; line-height: 20px; background: var(--fill-1); color: var(--text-2); }
.tag.brand { background: var(--brand-08); color: var(--brand); }
.tag.green { background: rgba(100, 187, 92, .12); color: #3E9C3A; }
.tag.gray { background: var(--fill-1); color: var(--text-3); }

.spin { animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.pt-input { width: 100%; height: 38px; border-radius: 8px; background: var(--fill-3); border: 1px solid transparent; padding: 0 12px; } .pt-input:focus { border-color: var(--brand); background: #fff; }

/* 设计系统：管理页（4:4913）与详情页（4:3677） */

/* ---------- 管理页 ---------- */
.ds-list { padding: 60px 112px 48px; }
.dl-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; max-width: 1396px; }
.dl-head h1 { font-size: 28px; line-height: 36px; font-weight: 700; color: var(--text-primary); }
.dl-head p { color: var(--text-secondary); }
.dl-actions { display: flex; align-items: center; gap: 12px; }
.dl-search { height: 32px; width: 220px; border-radius: 999px; background: var(--fill-1); display: flex; align-items: center; gap: 6px; padding: 0 12px; color: var(--text-2); }
.dl-search .ic { width: 16px; height: 16px; }
.dl-search .ic svg { width: 16px; height: 16px; }
.dl-search input { flex: 1; min-width: 0; font-size: 14px; }
.dl-grid { margin-top: 24px; display: grid; grid-template-columns: repeat(auto-fill, 260px); gap: 24px; max-width: 1420px; }
.ds-card { width: 260px; cursor: pointer; position: relative; }
.ds-card .cover { position: relative; width: 260px; height: 160px; border-radius: 12px; overflow: hidden; background: #E9EEF8; }
.ds-card .cover img { width: 100%; height: 100%; object-fit: cover; transition: transform .3s; }
.ds-card:hover .cover img { transform: scale(1.03); }
.ds-card .cover::after { content: ""; position: absolute; inset: 0; border-radius: 12px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.04); }
.ds-card .badges { position: absolute; left: 8px; top: 8px; display: flex; gap: 4px; z-index: 1; }
.ds-card .badges .tag { background: rgba(255,255,255,.92); }
.ds-card .badges .tag.brand { background: var(--brand); color: #fff; }
.ds-card .more { position: absolute; right: 8px; top: 8px; width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.92); display: none; align-items: center; justify-content: center; z-index: 1; }
.ds-card .more .ic { width: 16px; height: 16px; }
.ds-card:hover .more, .ds-card .more.open { display: flex; }
.ds-card .name { margin-top: 15px; font-weight: 500; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ds-card .meta { margin-top: 4px; display: flex; align-items: center; justify-content: space-between; color: var(--text-secondary); }
.ds-card .author { display: flex; align-items: center; gap: 4px; }
.ds-card .author img { width: 16px; height: 16px; border-radius: 50%; object-fit: cover; }
.ds-card .usage { display: flex; align-items: center; gap: 4px; }
.ds-card .usage .ic { width: 14px; height: 14px; color: var(--text-secondary); }
.ds-card.importing .cover::before { content: ""; position: absolute; inset: 0; background: rgba(255,255,255,.6); z-index: 1; }
.ds-card.just-added { animation: rise .4s ease-out; }
.dl-empty { margin-top: 80px; text-align: center; color: var(--text-3); }

/* ---------- 导入规范Skill ---------- */
.imp-tabs { display: flex; gap: 4px; padding: 2px; border-radius: 999px; background: var(--fill-1); width: max-content; margin-bottom: 16px; }
.imp-tabs button { height: 28px; padding: 0 16px; border-radius: 999px; color: var(--text-2); }
.imp-tabs button.on { background: #fff; color: var(--brand); font-weight: 500; box-shadow: var(--shadow-card); }
.imp-drop {
  border: 1.5px dashed rgba(0,0,0,.16); border-radius: 16px; height: 180px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  color: var(--text-2); cursor: pointer; transition: border-color .15s, background .15s; text-align: center;
}
.imp-drop:hover, .imp-drop.over { border-color: var(--brand); background: var(--brand-08); }
.imp-drop .ic { width: 32px; height: 32px; color: var(--brand); }
.imp-drop small { color: var(--text-3); font-size: 12px; }
.imp-lib { display: flex; flex-direction: column; gap: 8px; }
.imp-skill { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border-1); cursor: pointer; transition: border-color .15s, background .15s; }
.imp-skill:hover { border-color: rgba(10,89,247,.4); }
.imp-skill.on { border-color: var(--brand); background: var(--brand-08); }
.imp-skill .sk-ic { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, #5B8CFF, #0A59F7); color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.imp-skill .sk-ic .ic { width: 18px; height: 18px; }
.imp-skill .sk-body { flex: 1; min-width: 0; }
.imp-skill .sk-name { font-weight: 500; display: flex; gap: 6px; align-items: center; }
.imp-skill .sk-meta { font-size: 12px; color: var(--text-secondary); line-height: 18px; }
.imp-skill .radio { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid rgba(0,0,0,.25); flex-shrink: 0; }
.imp-skill.on .radio { border: 5px solid var(--brand); }

.imp-run { display: flex; flex-direction: column; gap: 16px; }
.imp-progress { height: 6px; border-radius: 3px; background: var(--fill-1); overflow: hidden; }
.imp-progress i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #5B8CFF, #0A59F7); border-radius: 3px; transition: width .35s; }
.imp-log { background: #1E1F22; color: #CFD3DC; border-radius: 12px; padding: 14px 16px; font: 12px/20px "SF Mono", Menlo, monospace; height: 220px; overflow: auto; }
.imp-log .ok { color: #7EE2A8; } .imp-log .miss { color: #8B8F98; } .imp-log .hd { color: #7CB7FF; }
.imp-cov { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.imp-cov div { border-radius: 10px; padding: 10px 12px; background: var(--fill-3); display: flex; align-items: center; justify-content: space-between; font-size: 13px; }
.imp-cov div.on { background: var(--brand-08); color: var(--brand); }
.imp-cov div .s { font-size: 12px; color: var(--text-3); }
.imp-cov div.on .s { color: var(--brand); }
.imp-form { display: flex; gap: 12px; align-items: center; }
.imp-form label { color: var(--text-2); white-space: nowrap; }
.imp-form input { flex: 1; height: 36px; border-radius: 8px; background: var(--fill-3); padding: 0 12px; }

/* ---------- 详情页 ---------- */
.dsd { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg-page); }
.dsd-head { background: #fff; padding: 22px 24px 0 40px; height: 134px; flex-shrink: 0; position: relative; }
.crumb { display: flex; align-items: center; gap: 8px; color: var(--text-secondary); height: 24px; margin-left: -4px; }
.crumb .back { width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; border-radius: 4px; color: var(--text-secondary); }
.crumb .back:hover { background: var(--fill-1); }
.crumb .back .ic { width: 14px; height: 14px; }
.crumb a { color: var(--text-secondary); cursor: pointer; }
.crumb a:hover { color: var(--brand); }
.crumb .cur { color: var(--text-primary); }
.dsd-title { margin-top: 18px; display: flex; align-items: center; gap: 12px; }
.ds-logo { width: 42px; height: 42px; border-radius: 10px; background: var(--brand); display: flex; align-items: center; justify-content: center; color: #fff; }
.ds-logo .ic { width: 22px; height: 22px; }
.dsd-name { font-size: 16px; line-height: 24px; font-weight: 500; color: var(--text-primary); }
.dsd-meta { display: flex; align-items: center; gap: 8px; margin-top: 2px; color: var(--text-secondary); font-size: 14px; line-height: 20px; }
.dsd-meta img { width: 16px; height: 16px; border-radius: 50%; object-fit: cover; }
.dsd-meta .bar { width: 1px; height: 12px; background: var(--border-1); }
.dsd-meta .ic { width: 14px; height: 14px; color: var(--text-secondary); }
.dsd-meta .src { color: var(--text-3); }
.dsd-actions { position: absolute; right: 24px; top: 64px; display: flex; gap: 12px; }

.dsd-body { flex: 1; min-height: 0; display: flex; gap: 10px; padding: 24px 24px 0; }
.dsd-nav { width: 216px; flex-shrink: 0; align-self: flex-start; background: #fff; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 16px; }
.dsd-nav button {
  height: 38px; border-radius: 8px; display: flex; align-items: center; gap: 12px; padding: 0 12px; color: var(--text-primary); font-size: 14px; text-align: left; position: relative;
}
.dsd-nav button:hover { background: var(--fill-3); }
.dsd-nav button.on { background: var(--brand-08); color: var(--brand); }
.dsd-nav button .ic { width: 16px; height: 16px; color: #191919; }
.dsd-nav button.on .ic { color: var(--brand); }
.dsd-nav button .ic svg { width: 14px; height: 14px; }
.dsd-nav button .cnt { margin-left: auto; font-size: 12px; color: var(--text-3); }
.dsd-nav button.empty .cnt { color: rgba(0,0,0,.25); }
.dsd-main { flex: 1; min-width: 0; overflow: auto; padding: 0 0 24px; display: flex; flex-direction: column; gap: 24px; scrollbar-width: thin; }
.sec-card { flex-shrink: 0; background: #fff; border-radius: 16px; padding: 24px; }
.sec-label { font-size: 13px; line-height: 20px; color: var(--text-secondary); }
.sec-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; }
.sec-title { margin-top: 12px; font-size: 24px; line-height: 32px; font-weight: 700; color: var(--text-primary); }
.sec-desc { margin-top: 12px; color: var(--text-primary); }
.sec-divider { height: 1px; background: var(--border-1); margin: 24px 0; }
.sec-tools { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
.sub-title { font-size: 14px; line-height: 22px; color: var(--text-primary); margin-bottom: 12px; display: flex; align-items: baseline; gap: 8px; }
.sub-title small { color: var(--text-3); font-size: 12px; }
.sub-block + .sub-block { margin-top: 32px; }
.rules { margin-top: 32px; padding: 16px 20px; border-radius: 12px; background: var(--fill-3); }
.rules h4 { font-size: 14px; font-weight: 500; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.rules h4 .ic { width: 16px; height: 16px; color: var(--brand); }
.rules li { position: relative; padding-left: 14px; color: var(--text-2); font-size: 13px; line-height: 22px; }
.rules li::before { content: ""; position: absolute; left: 2px; top: 9px; width: 4px; height: 4px; border-radius: 50%; background: var(--text-3); }
.rules code, .code { font-family: "SF Mono", Menlo, monospace; font-size: 12px; background: rgba(0,0,0,.05); padding: 0 4px; border-radius: 4px; }
.seg-sm { display: inline-flex; gap: 2px; padding: 2px; border-radius: 999px; background: var(--fill-1); }
.seg-sm button { height: 26px; padding: 0 12px; border-radius: 999px; color: var(--text-2); font-size: 13px; display: inline-flex; align-items: center; gap: 4px; }
.seg-sm button .ic { width: 14px; height: 14px; }
.seg-sm button.on { background: #fff; color: var(--brand); box-shadow: var(--shadow-card); }

/* 空状态 */
.sec-empty { margin-top: 24px; padding: 40px 24px; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--text-3); text-align: center; }
.sec-empty .ei { width: 56px; height: 56px; border-radius: 16px; background: var(--fill-3); display: flex; align-items: center; justify-content: center; color: rgba(0,0,0,.25); margin-bottom: 4px; }
.sec-empty .ei .ic { width: 26px; height: 26px; }
.sec-empty .ei .ic svg { width: 22px; height: 22px; }
.sec-empty b { color: var(--text-2); font-weight: 500; font-size: 15px; }
.sec-empty .btn { margin-top: 8px; }
.overview-text { margin-top: 12px; font-size: 15px; line-height: 28px; color: var(--text-primary); max-width: 960px; white-space: pre-wrap; }
.ov-source { margin-top: 24px; display: flex; gap: 8px; flex-wrap: wrap; }

/* 颜色 */
.palette { display: flex; height: 72px; border-radius: 12px; overflow: hidden; }
.palette .cell { flex: 1; padding: 8px; display: flex; flex-direction: column; justify-content: space-between; font-size: 12px; line-height: 20px; cursor: pointer; transition: flex .2s; }
.palette .cell:hover { flex: 1.25; }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(164px, 1fr)); gap: 12px; }
.swatch { border: 1px solid var(--border-1); border-radius: 8px; overflow: hidden; cursor: pointer; transition: box-shadow .15s, transform .15s; background: #fff; }
.swatch:hover { box-shadow: 0 4px 16px rgba(0,0,0,.08); transform: translateY(-1px); }
.swatch .chip-c { height: 94px; position: relative; display: flex; align-items: flex-end; padding: 8px; font-size: 12px; line-height: 20px; }
.swatch .chip-c.light-c { box-shadow: inset 0 -1px 0 var(--border-1); }
.swatch .chip-c .copy { position: absolute; right: 8px; top: 8px; opacity: 0; transition: opacity .15s; width: 16px; height: 16px; }
.swatch:hover .chip-c .copy { opacity: .9; }
.swatch .chip-c.checker { background-image: linear-gradient(45deg, #eee 25%, transparent 25%), linear-gradient(-45deg, #eee 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #eee 75%), linear-gradient(-45deg, transparent 75%, #eee 75%); background-size: 12px 12px; background-position: 0 0, 0 6px, 6px -6px, -6px 0; }
.swatch .chip-c .fill { position: absolute; inset: 0; }
.swatch .chip-c span { position: relative; }
.swatch .info { padding: 10px 12px 12px; }
.swatch .nm { font-size: 14px; line-height: 22px; font-weight: 500; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.swatch .tk { font-size: 14px; line-height: 22px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 字体 */
.fam-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.fam { border: 1px solid var(--border-1); border-radius: 12px; padding: 20px; display: flex; align-items: center; gap: 20px; }
.fam .aa { font-size: 56px; line-height: 64px; font-weight: 500; color: var(--text-primary); }
.fam .fn { font-weight: 500; }
.fam .fw { font-size: 12px; color: var(--text-secondary); }
.type-table { border: 1px solid var(--border-1); border-radius: 12px; overflow: hidden; }
.type-row { display: grid; grid-template-columns: 220px 160px 1fr 40px; align-items: center; gap: 16px; padding: 14px 20px; border-top: 1px solid var(--border-1); cursor: pointer; }
.type-row:first-child { border-top: 0; }
.type-row:hover { background: var(--fill-3); }
.type-row .tn { font-weight: 500; font-size: 14px; line-height: 22px; }
.type-row .tv { font-size: 12px; color: var(--text-secondary); line-height: 18px; }
.type-row .sample { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-primary); }
.type-row .ic { width: 16px; height: 16px; color: var(--text-3); opacity: 0; }
.type-row:hover .ic { opacity: 1; }
.sample-input { height: 32px; width: 280px; border-radius: 8px; background: var(--fill-3); padding: 0 10px; font-size: 13px; }

/* 间距 / 圆角 / 阴影 */
.sp-list { border: 1px solid var(--border-1); border-radius: 12px; overflow: hidden; }
.sp-row { display: grid; grid-template-columns: 200px 80px 1fr 1.2fr; gap: 16px; align-items: center; padding: 12px 20px; border-top: 1px solid var(--border-1); cursor: pointer; }
.sp-row:first-child { border-top: 0; }
.sp-row:hover { background: var(--fill-3); }
.sp-row .nm { font-weight: 500; font-family: "SF Mono", Menlo, var(--font); font-size: 13px; }
.sp-row .vl { color: var(--text-secondary); font-size: 13px; }
.sp-row .bar { height: 16px; display: flex; align-items: center; }
.sp-row .bar i { display: block; height: 16px; background: rgba(10,89,247,.18); border-left: 2px solid var(--brand); border-right: 2px solid var(--brand); border-radius: 2px; }
.sp-row .ds { color: var(--text-secondary); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scene-tabs { margin-bottom: 12px; }
.rad-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.rad { border: 1px solid var(--border-1); border-radius: 12px; padding: 20px 16px 14px; display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: box-shadow .15s; }
.rad:hover { box-shadow: 0 4px 16px rgba(0,0,0,.06); }
.rad .demo { width: 88px; height: 88px; background: rgba(10,89,247,.1); border: 2px solid var(--brand); }
.rad .nm { margin-top: 14px; font-weight: 500; font-size: 13px; font-family: "SF Mono", Menlo, var(--font); }
.rad .vl { font-size: 12px; color: var(--text-secondary); text-align: center; }
.sh-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 24px; padding: 32px; border-radius: 16px; background: #F5F6F8; transition: background .2s; }
.sh-grid.dark { background: #1B1C1F; }
.sh { background: #fff; border-radius: 12px; height: 140px; padding: 16px; display: flex; flex-direction: column; justify-content: flex-end; cursor: pointer; transition: transform .15s; }
.sh-grid.dark .sh { background: #2A2C30; color: #fff; }
.sh:hover { transform: translateY(-2px); }
.sh .nm { font-weight: 500; font-size: 14px; }
.sh .vl { font-size: 12px; color: var(--text-secondary); font-family: "SF Mono", Menlo, monospace; line-height: 18px; word-break: break-all; }
.sh-grid.dark .sh .vl { color: rgba(255,255,255,.55); }

/* 组件 */
.cp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.cp { border: 1px solid var(--border-1); border-radius: 12px; overflow: hidden; cursor: pointer; transition: box-shadow .15s, border-color .15s; display: flex; flex-direction: column; }
.cp:hover { box-shadow: 0 6px 20px rgba(0,0,0,.07); border-color: rgba(10,89,247,.3); }
.cp .stagebox { height: 148px; background: #F2F3F5; display: flex; align-items: center; justify-content: center; padding: 16px; overflow: hidden; position: relative; }
.cp .stagebox img { max-width: 100%; max-height: 100%; object-fit: contain; }
.cp .body { padding: 12px 16px 14px; }
.cp .nm { font-weight: 500; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cp .dsc { font-size: 13px; color: var(--text-secondary); line-height: 20px; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 40px; }
.cp-drawer-head { padding: 20px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-1); }
.cp-drawer-head h3 { font-size: 18px; font-weight: 700; }
.cp-drawer-body { flex: 1; overflow: auto; padding: 20px 24px 32px; display: flex; flex-direction: column; gap: 24px; }
.cp-preview { border-radius: 12px; background: #F2F3F5; min-height: 200px; display: flex; align-items: center; justify-content: center; padding: 32px; flex-wrap: wrap; gap: 16px; }
.cp-preview img { max-width: 100%; max-height: 260px; object-fit: contain; }
.prop-ctl { display: flex; flex-direction: column; gap: 12px; }
.prop-ctl .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.prop-ctl .row > span { width: 96px; color: var(--text-2); font-size: 13px; font-family: "SF Mono", Menlo, var(--font); }
.prop-ctl .opts { display: flex; flex-wrap: wrap; gap: 6px; }
.prop-ctl .opts button { height: 26px; padding: 0 10px; border-radius: 6px; background: var(--fill-1); font-size: 12px; }
.prop-ctl .opts button.on { background: var(--brand); color: #fff; }
.variant-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.variant { border: 1px solid var(--border-1); border-radius: 10px; overflow: hidden; cursor: pointer; }
.variant.on { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
.variant .vi { height: 84px; background: #F2F3F5; display: flex; align-items: center; justify-content: center; padding: 8px; }
.variant .vi img { max-width: 100%; max-height: 100%; object-fit: contain; }
.variant .vl { padding: 6px 8px; font-size: 11px; line-height: 16px; color: var(--text-2); }
.kv-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.kv-table th { text-align: left; color: var(--text-2); font-weight: 500; background: var(--fill-3); padding: 8px 12px; }
.kv-table td { padding: 10px 12px; border-bottom: 1px solid var(--border-1); vertical-align: top; }
.score { display: inline-flex; align-items: center; gap: 4px; }

/* 资产 */
.as-tools { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.as-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.as-item { height: 104px; border-radius: 10px; border: 1px solid transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; cursor: pointer; padding: 8px; transition: background .15s, border-color .15s; }
.as-item:hover { background: var(--fill-3); border-color: var(--border-1); }
.as-item img { width: 32px; height: 32px; object-fit: contain; }
.as-item span { font-size: 11px; line-height: 14px; color: var(--text-secondary); width: 100%; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.as-more { margin-top: 16px; text-align: center; }

/* 组件预览（引用设计系统主题变量） */
.pv { font-family: var(--ff); color: var(--t1); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; font-size: 13px; }
.pv-btn { height: 32px; padding: 0 16px; border-radius: var(--r-a); border: 1px solid transparent; font: inherit; display: inline-flex; align-items: center; gap: 6px; }
.pv-btn.filled { background: var(--p); color: var(--on-p); }
.pv-btn.outlined { border-color: var(--p); color: var(--p); background: transparent; }
.pv-btn.text { color: var(--p); background: transparent; }
.pv-btn.danger.filled { background: var(--err); }
.pv-btn.danger.outlined { border-color: var(--err); color: var(--err); }
.pv-btn.default.filled { background: rgba(0,0,0,.06); color: var(--t1); }
.pv-btn.default.outlined { border-color: var(--bd); color: var(--t1); }
.pv-btn.lg { height: 40px; font-size: 15px; } .pv-btn.sm { height: 24px; padding: 0 10px; font-size: 12px; }
.pv-btn[disabled] { opacity: .4; }
.pv-input { height: 32px; width: 200px; border: 1px solid var(--bd); border-radius: var(--r-a); padding: 0 10px; display: flex; align-items: center; color: var(--t2); background: var(--card, #fff); }
.pv-input.err { border-color: var(--err); }
.pv-input.focus { border-color: var(--p); box-shadow: 0 0 0 2px var(--p-soft); }
.pv-switch { width: 36px; height: 20px; border-radius: 999px; background: rgba(0,0,0,.2); position: relative; }
.pv-switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: left .15s; }
.pv-switch.on { background: var(--p); } .pv-switch.on::after { left: 18px; }
.pv-check { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--bd); display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: 11px; }
.pv-check.on { background: var(--p); border-color: var(--p); }
.pv-radio { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--bd); display: inline-block; }
.pv-radio.on { border: 5px solid var(--p); }
.pv-label { display: inline-flex; align-items: center; gap: 6px; }
.pv-tabs { display: flex; gap: 20px; border-bottom: 1px solid var(--bd); width: 240px; }
.pv-tabs span { padding: 6px 0; color: var(--t2); }
.pv-tabs span.on { color: var(--p); font-weight: 500; box-shadow: inset 0 -2px 0 var(--p); }
.pv-tag { height: 22px; padding: 0 8px; border-radius: 4px; display: inline-flex; align-items: center; font-size: 12px; background: rgba(0,0,0,.05); }
.pv-tag.primary { background: var(--p-soft); color: var(--p); }
.pv-tag.success { background: rgba(22,163,74,.1); color: var(--ok); }
.pv-tag.warning { background: rgba(245,158,11,.12); color: #B45309; }
.pv-tag.error { background: rgba(232,64,38,.1); color: var(--err); }
.pv-alert { width: 260px; padding: 8px 12px; border-radius: var(--r-a); background: var(--p-soft); display: flex; gap: 8px; align-items: center; font-size: 12px; }
.pv-alert i { width: 14px; height: 14px; border-radius: 50%; background: var(--p); flex-shrink: 0; }
.pv-alert.success { background: rgba(22,163,74,.1); } .pv-alert.success i { background: var(--ok); }
.pv-alert.warning { background: rgba(245,158,11,.12); } .pv-alert.warning i { background: var(--warn); }
.pv-alert.error { background: rgba(232,64,38,.1); } .pv-alert.error i { background: var(--err); }
.pv-badge { position: relative; width: 36px; height: 36px; border-radius: 8px; background: rgba(0,0,0,.06); }
.pv-badge b { position: absolute; top: -6px; right: -8px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--err); color: #fff; font-size: 11px; font-weight: 500; display: flex; align-items: center; justify-content: center; }
.pv-pager { display: flex; gap: 6px; }
.pv-pager span { min-width: 28px; height: 28px; border-radius: var(--r-a); border: 1px solid var(--bd); display: flex; align-items: center; justify-content: center; font-size: 12px; }
.pv-pager span.on { background: var(--p); border-color: var(--p); color: var(--on-p); }
.pv-card { width: 220px; border-radius: var(--r-c); background: #fff; box-shadow: var(--sh); padding: 12px 14px; text-align: left; }
.pv-card b { font-weight: 500; display: block; } .pv-card span { color: var(--t2); font-size: 12px; }
.pv-crumb { color: var(--t2); } .pv-crumb b { color: var(--t1); font-weight: 400; }
.pv-link { color: var(--p); }
.pv-generic { color: var(--t2); display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; }
.pv-generic .ic { width: 28px; height: 28px; color: var(--p); }

/* 上传压缩包：已选择时显示 zip 图标与完成标记 */
.zip-ic { position: relative; width: 40px; height: 48px; color: var(--brand); margin-bottom: 4px; }
.zip-ic svg { width: 40px; height: 48px; display: block; }
.zip-done { position: absolute; right: -8px; bottom: -4px; width: 20px; height: 20px; border-radius: 50%; background: var(--brand); color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px #fff; animation: pop .2s ease-out; }
.imp-drop .zip-done .ic { width: 12px; height: 12px; color: #fff; }

/* 阴影：沿用间距的列表样式，每行带预览块 */
.sp-row.sh-row { grid-template-columns: 88px 200px 1.4fr 1fr; padding: 16px 20px; }
.sh-demo { width: 72px; height: 48px; border-radius: 8px; overflow: hidden; background: #F5F6F8; display: flex; align-items: center; justify-content: center; }
.sh-demo i { display: block; width: 44px; height: 28px; border-radius: 6px; background: #fff; }
.sh-val { font-family: "SF Mono", Menlo, monospace; font-size: 12px; }

/* 组件：卡片内直接展示变体与实时预览 */
.cp-picker { display: flex; flex-wrap: wrap; gap: 8px; }
.cp-picker button { height: 32px; padding: 0 14px; border-radius: 999px; background: var(--fill-1); color: var(--text-1); font-size: 13px; }
.cp-picker button:hover { background: rgba(0,0,0,.08); }
.cp-picker button.on { background: var(--brand-08); color: var(--brand); font-weight: 500; }
.cp-block { margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--border-1); }
.cp-title { font-size: 20px; line-height: 28px; font-weight: 500; color: var(--text-primary); }
.cp-desc { margin-top: 8px; color: var(--text-primary); }
.cp-ctls { display: flex; flex-wrap: wrap; gap: 16px 40px; margin-top: 24px; }
.cp-ctl { display: flex; align-items: center; gap: 12px; }
.cp-ctl > span { color: var(--text-primary); white-space: nowrap; }
.cp-ctl .seg-sm button { height: 28px; padding: 0 16px; font-size: 14px; }
.cp-stage { margin-top: 24px; border: 1px solid var(--border-1); border-radius: 12px; overflow: hidden; }
.cp-stage-head { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid var(--border-1); font-size: 13px; }
.cp-stage-head > span { display: flex; align-items: center; gap: 6px; }
.cp-stage-head .ic { width: 16px; height: 16px; color: #8B5CF6; }
.cp-stage-head .live { color: var(--text-secondary); }
.cp-stage-head .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--brand); display: block; animation: livePulse 1.6s ease-in-out infinite; }
@keyframes livePulse { 50% { opacity: .35; } }
.cp-stage-body { min-height: 236px; padding: 40px; display: flex; align-items: center; justify-content: center; background-color: #F5F6F8; background-image: radial-gradient(rgba(0,0,0,.12) 1px, transparent 1px); background-size: 16px 16px; }
.cp-shot { max-width: 100%; height: auto; display: block; }
.pv.st-hover .pv-btn, .pv.st-hover .pv-input, .pv.st-hover .pv-switch, .pv.st-hover .pv-tag { filter: brightness(.94); }
.pv.st-pressed .pv-btn, .pv.st-pressed .pv-switch, .pv.st-pressed .pv-tag { filter: brightness(.86); transform: scale(.98); }
.pv.st-disabled > * { opacity: .4; pointer-events: none; }

/* 管理员视角 */
.role-sw button { height: 28px; padding: 0 14px; font-size: 14px; }
.add-btn { height: 30px; padding: 0 12px; font-size: 13px; }
.add-btn .ic { width: 14px; height: 14px; }
.dsd.admin [data-edit] { position: relative; cursor: pointer; }
.dsd.admin [data-edit]:hover { outline: 1.5px dashed var(--brand); outline-offset: 2px; }
.dsd.admin .type-row .ic, .dsd.admin .swatch .copy { display: none; }
.dsd.admin [data-edit]::after { content: "编辑"; position: absolute; right: 8px; top: 8px; font-size: 11px; line-height: 18px; padding: 0 6px; border-radius: 4px; background: var(--brand); color: #fff; opacity: 0; transition: opacity .15s; pointer-events: none; z-index: 2; }
.dsd.admin [data-edit]:hover::after { opacity: 1; }
.dsd.admin .palette .cell[data-edit]::after { top: 4px; right: 4px; }
.mk { margin-left: 6px; height: 18px; font-size: 11px; vertical-align: 1px; }
.swatch .mk, .rad .mk { position: absolute; left: 8px; top: 8px; margin: 0; z-index: 2; }
.rad { position: relative; }
.ed-form { display: flex; flex-direction: column; gap: 14px; }
.ed-field { display: flex; flex-direction: column; gap: 6px; flex: 1; }
.ed-field > span { font-size: 13px; color: var(--text-2); }
.ed-field input, .ed-field select { height: 36px; border-radius: 8px; background: var(--fill-3); border: 1px solid transparent; padding: 0 12px; font: inherit; color: var(--text-1); outline: 0; }
.ed-field input:focus, .ed-field select:focus { border-color: var(--brand); background: #fff; }
.ed-row { display: flex; gap: 12px; }
.ed-color { display: flex; gap: 8px; }
.ed-color input[type=color] { width: 44px; padding: 2px; flex-shrink: 0; cursor: pointer; }
.ed-color input:not([type=color]) { flex: 1; }
.ed-preview { border-radius: 10px; background: #F5F6F8; padding: 16px; text-align: center; font-size: 24px; color: var(--text-primary); }
.sh-pv { display: flex; justify-content: center; padding: 28px; }
.sh-pv i { display: block; width: 120px; height: 64px; border-radius: 10px; background: #fff; }
.ed-del { color: #E84026; }

/* 左侧导航：组件可展开 */

/* 组件平铺 */

/* token 渲染预览的真实交互 */

/* 组件源码渲染与无源码空状态 */
.cp-stage-body:has(.cp-frame) { padding: 16px; }
.cp-frame { width: 100%; height: 200px; border: 0; background: transparent; display: block; }

.cp-nosrc { max-width: 560px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; color: var(--text-3); font-size: 13px; line-height: 20px; }

.cp-stage-body:has(.cp-frame) { padding: 0; display: block; }
.cp-frame { min-height: 140px; }

/* 三端映射 */
[data-map] { margin-top: 20px; }
.map-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
.map-head b { font-size: 15px; font-weight: 500; color: var(--text-primary); }
.map-head small { color: var(--text-3); font-size: 12px; }
.map-head .tag { margin-left: auto; }
.map-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.map-card { border: 1px solid var(--border-1); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: #fff; }

.map-tokens td { font-size: 12px; }
.map-tokens td .sw { width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--border-1); display: inline-block; vertical-align: -2px; margin-right: 6px; }

/* 组件三列表格 */
.ct-legend { display: flex; flex-wrap: wrap; gap: 20px; font-size: 13px; color: var(--text-2); margin-bottom: 16px; }
.ct-legend > span { display: inline-flex; align-items: center; gap: 8px; }
.src-badge { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; border: 1px solid var(--border-1); color: var(--text-2); background: #fff; white-space: nowrap; }
.src-badge.ok { color: #3E9C3A; border-color: rgba(62,156,58,.35); background: rgba(100,187,92,.08); }
.src-badge.ai { color: var(--brand); border: 1px dashed rgba(10,89,247,.45); background: var(--brand-08); }

.ct-table { border: 1px solid var(--border-1); border-radius: 12px; overflow: hidden; }
.ct-row { display: grid; grid-template-columns: 240px minmax(0, 1fr) 300px; border-top: 1px solid var(--border-1); }
.ct-row:first-child { border-top: 0; }

.ct-preview > .pv, .ct-preview > .ct-shots, .ct-preview > .ct-empty { margin: 20px; }

.ct-shots img { height: 56px; border-radius: 8px; background: #F2F3F5; transition: transform .15s; }
.ct-shots img:hover { transform: scale(1.6); position: relative; z-index: 2; box-shadow: 0 4px 16px rgba(0,0,0,.12); }
.ct-empty { border: 1px dashed rgba(0,0,0,.16); border-radius: 8px; padding: 20px; text-align: center; color: var(--text-3); font-size: 13px; }
.ct-map { display: flex; flex-direction: column; gap: 8px; font-size: 12px; position: relative; }
.ct-map-h { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.ct-map-h b { min-width: 0; overflow-wrap: anywhere; font-weight: 500; color: var(--text-primary); }
.ct-map-h .map-st { margin-left: auto; flex-shrink: 0; white-space: nowrap; }
.map-ic.off { background: #C9C9C9; }
.ct-map-kv { display: grid; grid-template-columns: 56px 1fr; gap: 8px; align-items: start; color: var(--text-1); }
.ct-map-kv > span { color: var(--text-3); }

.ct-map .map-prop { font-size: 11px; }
.ct-map .map-btn { margin-top: 4px; }
.ct-sample { align-self: flex-start; }

.ct-row.cp-block { margin-top: 0; padding-top: 0; border-top: 1px solid var(--border-1); }

/* 资产：大类 → 小类 + 表格 */
.as-cat { margin-top: 20px; border: 1px solid var(--border-1); border-radius: 12px; overflow: hidden; }
.as-cat-h { display: flex; align-items: center; gap: 8px; padding: 14px 20px; border-bottom: 1px solid var(--border-1); }

.as-cat-h small { color: var(--text-3); font-size: 12px; }
.as-cat-act { margin-left: auto; display: flex; gap: 4px; }

.as-cat-act .icon-btn .ic { width: 16px; height: 16px; }
.as-subs { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 20px; border-bottom: 1px solid var(--border-1); }
.as-subs button { height: 26px; padding: 0 10px; border-radius: 999px; background: var(--fill-1); font-size: 12px; color: var(--text-2); display: inline-flex; align-items: center; gap: 4px; }

.as-subs .as-sub-add .ic { width: 12px; height: 12px; }
.as-row { display: grid; grid-template-columns: minmax(0, 1.4fr) 120px minmax(0, 1fr); border-top: 1px solid var(--border-1); align-items: center; }
.as-row:first-child { border-top: 0; }
.as-row > div { padding: 10px 20px; min-width: 0; }
.as-row > div + div { border-left: 1px solid var(--border-1); align-self: stretch; display: flex; align-items: center; }
.as-th > div { padding: 10px 20px; font-size: 12px; color: var(--text-3); background: var(--fill-3); }
.as-row:not(.as-th):hover { background: var(--fill-3); }
.as-nm { font-family: "SF Mono", Menlo, monospace; font-size: 13px; color: var(--text-1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.as-pv { width: 52px; height: 52px; border-radius: 10px; border: 1px solid var(--border-1); background: #fff; display: inline-flex; align-items: center; justify-content: center; overflow: hidden; }
.as-pv img { max-width: 36px; max-height: 36px; object-fit: contain; }
.as-ty { font-size: 13px; color: var(--text-3); justify-content: space-between; gap: 8px; }
.as-ops { display: none; gap: 6px; }
.as-row:hover .as-ops { display: inline-flex; }
.as-ops .btn { height: 26px; padding: 0 10px; font-size: 12px; }
.as-ops .btn .ic { width: 14px; height: 14px; }
.as-ops .btn.danger { color: #E84026; }
.as-empty { padding: 28px 20px; text-align: center; color: var(--text-3); font-size: 13px; }
.as-cat .as-more { margin: 0; padding: 12px; border-top: 1px solid var(--border-1); }
.as-file { background: var(--fill-3); }
.as-file-ic { position: relative; width: 26px; height: 32px; border-radius: 4px; background: #fff; border: 1.5px solid var(--fc); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 3px; }
.as-file-ic::before { content: ""; position: absolute; top: -1.5px; right: -1.5px; width: 9px; height: 9px; background: var(--fill-3); border-left: 1.5px solid var(--fc); border-bottom: 1.5px solid var(--fc); border-bottom-left-radius: 2px; }
.as-file-ic b { font-size: 7px; font-weight: 700; color: #fff; background: var(--fc); border-radius: 2px; padding: 0 2px; line-height: 10px; letter-spacing: .2px; }
/* 窄屏时压缩名称列和映射列，给预览留出空间 */
.ct-row { grid-template-columns: clamp(150px, 13vw, 240px) minmax(0, 1fr) clamp(210px, 17vw, 300px); }
.ct-row > div { padding: 16px; }

/* 组件契约声明了、规范样式没实现的状态数（由转化脚本比对得出） */
.ct-miss{display:inline-block;margin-top:8px;padding:0 8px;border:1px dashed #c4c4c4;border-radius:10px;font-size:12px;line-height:18px;color:#8a8a8a}
/* 组件分类（与资产区块同样的分类卡片 + 小类标签） */
.ct-cat .ct-table { border: 0; border-radius: 0; }
.ct-row[hidden], .ct-cat .as-empty[hidden] { display: none; }
.dsd-nav .dsd-sub button em { font-style: normal; color: var(--text-3); margin-left: 6px; font-size: 12px; }
/* 布局 Pattern */
.pt-rules { margin: 16px 0 0; padding-left: 18px; color: var(--text-2); font-size: 13px; line-height: 22px; }
.pt-card { margin-top: 20px; border: 1px solid var(--border-1); border-radius: 12px; overflow: hidden; }
.pt-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 20px; border-bottom: 1px solid var(--border-1); }
.pt-head b { font-size: 15px; font-weight: 500; color: var(--text-primary); margin-right: 10px; }
.pt-head span { color: var(--text-3); font-size: 12px; }
.pt-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.pt-preview { padding: 20px; background: var(--fill-1); border-bottom: 1px solid var(--border-1); }
.pt-frame { display: block; width: 100%; height: 420px; border: 0; border-radius: 8px; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.06); }
.pt-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; padding: 20px; }

.pt-sub { font-size: 13px; font-weight: 500; color: var(--text-primary); margin-bottom: 8px; }

/* 组件导航：一级分类 + 组件名 */

.pt-bar button { height: 28px; padding: 0 10px; border-radius: 6px; font-size: 13px; color: var(--text-2); }
.pt-bar button:hover { background: var(--fill-1); }
.pt-bar button.on { background: var(--brand-soft, rgba(10,89,247,.1)); color: var(--brand); font-weight: 500; }
.pt-bar em { margin-left: auto; font-style: normal; font-size: 12px; color: var(--text-3); }

.ct-map.none .map-st { margin-left: 0; align-self: flex-start; width: fit-content; white-space: nowrap; }

/* 上传 DESIGN.md */
.imp-drop { height: auto; min-height: 200px; padding: 20px 16px; cursor: default; }
.imp-pick { display: flex; gap: 8px; margin-top: 4px; }
.imp-pick .btn { height: 30px; padding: 0 14px; background: #fff; border: 1px solid var(--border-1); }

/* 概览：设计理念 / 设计原则（纯文本） */

.ce-form { display: flex; flex-direction: column; gap: 12px; }

.imp-mode b { font-size: 13px; color: var(--text-1); font-weight: 500; }

/* 设计系统：管理页（4:4913）与详情页（4:3677） */

/* Source-backed scope, principles, layout and reference cards. */
.overview-prose { max-width: 980px; overflow-wrap: anywhere; color: var(--text-primary); font-size: 15px; line-height: 28px; }
.overview-group { margin-top: 28px; }

.display-group { margin-top: 28px; }

.display-item-head { display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; }

@media (max-width: 800px) { .display-item-head { flex-wrap: wrap; } }

/* Designer-friendly summaries and source-backed layout diagrams. */

.layout-mapping p { margin-top: 10px; max-width: 760px; line-height: 1.8; }
.layout-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 430px), 1fr)); gap: 20px; align-items: start; }

.layout-window-body span { font-size: 12px; color: #7f8da0; }
.layout-metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; margin: 18px 0 0; }
.layout-metrics > div { display: flex; flex-direction: column; gap: 4px; }
.layout-metrics span { font-size: 11px; color: #7b879a; }
.layout-metrics b { font-size: 14px; color: #3a5274; font-weight: 500; overflow-wrap: anywhere; }
.layout-visual:has(.layout-window) .layout-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.layout-footnote { font-size: 11px; color: #7d899a; line-height: 1.7; margin-top: 14px !important; }
.layout-device-range { display: flex; align-items: flex-start; gap: 12px; padding-top: 8px; }
.layout-device-range > div { flex: 1; display: flex; align-items: center; flex-direction: column; text-align: center; gap: 8px; }
.layout-device { height: 60px; width: 35px; border: 2px solid #a6bbd7; border-radius: 5px; padding: 6px; margin-bottom: 6px; }
.layout-device.device-1 { width: 65px; }.layout-device.device-2 { width: 94px; background: #edf3ff; border-color: #648fc7; }
.layout-device i { height: 75%; width: 100%; margin: 0; }
.layout-device-range b { font-size: 13px; color: #3f5c85; }.layout-device-range span { font-size: 11px; color: #7b879a; }
.layout-device-range small { font-size: 11px; line-height: 1.7; color: #7b879a; }
.density-options { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 18px; }
.density-options button { border: 1px solid #d7e0ed; border-radius: 6px; padding: 7px 12px; font-size: 12px; color: #6a7d97; background: white; cursor: pointer; }
.density-options button.on { color: #255bc0; border-color: #89ace6; background: #eaf1ff; }
.density-stage { max-width: 640px; margin: 0 auto; background: #e9eef6; border: 1px solid #ccd8e8; border-radius: 8px; overflow: hidden; }
.density-navigation { height: 30px; background: #dae4f2; padding: 5px 12px; color: #5c7395; font-size: 11px; }
.density-page { display: flex; min-height: 160px; }
.density-panel { flex: 2; min-width: 0; background: white; border-radius: 5px; color: #6a7d97; font-size: 12px; }
.density-secondary { flex: 1; }.density-field { min-height: 20px; background: #f2f5fa; border: 1px solid #d9e2ef; border-radius: 4px; padding: 2px 8px; margin-top: 8px; font-size: 10px; }
.layout-rule-card:has([data-density]) .layout-metrics { max-width: 640px; margin: 16px auto 0; }
.layout-shell { display: flex; border: 1px solid #c5d3e5; border-radius: 7px; overflow: hidden; min-height: 170px; }
.layout-pane { flex: 1; min-width: 0; background: #edf2f9; }.layout-pane + .layout-pane { border-left: 1px solid #c5d3e5; }
.layout-pane.pane-1 { flex: 1.4; background: #f0f4fa; }.layout-pane.pane-2 { flex: 1.8; background: white; }
.layout-pane-title { padding: 9px 7px; min-height: 33px; font-size: 10px; color: #778ba6; white-space: nowrap; }
.layout-pane-body { padding: 10px 8px; }.layout-pane-body b { display: block; font-size: 11px; color: #4d6a92; }.layout-pane-body small { display: block; font-size: 10px; margin-top: 8px; color: #7d90aa; }
.layout-inset { display: grid; grid-template-columns: 42px 1fr 42px; grid-template-rows: 27px 115px 30px; background: #e8effa; border: 1px solid #cbd9ed; border-radius: 7px; text-align: center; font-size: 11px; color: #7290b7; align-items: center; }
.inset-top { grid-column: 2; }.inset-left { grid-row: 2; }.inset-content { grid-column: 2; grid-row: 2; height: 100%; padding: 16px; background: white; color: #58749d; text-align: left; border: 1px dashed #9db9e0; }.inset-right { grid-column: 3; grid-row: 2; }.inset-bottom { grid-column: 1 / -1; grid-row: 3; }
.layout-axis { border-left: 2px solid #91a8c5; padding: 10px 0; }.axis-label { font-size: 10px; color: #8998ad; padding-left: 8px; margin-bottom: 12px; }
.axis-surface { border-left: 2px dashed #79a3de; background: #e9f0fc; padding: 10px 0; font-size: 11px; color: #6b86ac; }
.axis-surface > span { padding-left: 8px; }.axis-content { border-left: 2px solid #3d6eb7; padding: 18px 8px; margin-top: 12px; background: white; color: #3e6498; }.axis-formula { margin-top: 18px; padding-left: 8px; font-size: 11px; color: #7290b7; }
.layout-grid-demo { display: flex; gap: 5px; min-height: 140px; padding: 10px 0; }.layout-grid-demo > div { flex: 1; border: 1px solid #c5d5ec; background: #e3ecfa; color: #7c97bd; font-size: 10px; text-align: center; padding-top: 8px; border-radius: 2px; }
.layout-compare { display: flex; align-items: center; gap: 14px; min-height: 160px; }.layout-compare > div { flex: 1; min-width: 0; }.layout-compare small, .layout-compare > div > span { display: block; color: #8696ab; font-size: 11px; margin-top: 10px; text-align: center; }
.layout-arrow { color: #91a5c1; font-size: 20px; flex-shrink: 0; }
.layout-mini-table { background: white; border: 1px solid #cbd8e9; border-radius: 6px; padding: 9px; }.layout-mini-table header { font-size: 10px; color: #6881a3; background: #eaf0f9; padding: 6px 3px; }.layout-mini-table b { display: block; font-size: 10px; color: #4c79bc; text-align: right; margin-top: 10px; }
.layout-form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 8px; }.layout-form.narrow { grid-template-columns: 1fr; }.layout-form span { font-size: 10px; color: #7087a6; }.layout-form input { display: block; background: white; width: 100%; height: 20px; border: 1px solid #c6d5e9; margin-top: 4px; border-radius: 3px; }.layout-form em { font-size: 9px; color: #8495ac; font-style: normal; }
.layout-content-order { display: flex; gap: 6px; min-height: 130px; }.layout-content-order b, .layout-content-order span { padding: 16px 8px; background: #e2ebf9; border: 1px solid #c2d4ed; border-radius: 4px; font-size: 11px; color: #6986ad; }.layout-content-order b { flex: 2; }.layout-content-order span { flex: 1; background: white; }.layout-content-order.narrow { flex-direction: column; }
.navigation-example, .resize-window { display: flex; min-height: 130px; background: white; border: 1px solid #c4d3e8; border-radius: 5px; overflow: hidden; font-size: 10px; color: #6f87a9; }.navigation-example aside, .resize-window aside { background: #e3ebf7; padding: 12px 7px; line-height: 2; }.navigation-example main, .resize-window main { padding: 12px 8px; line-height: 2; flex: 1; }.navigation-example.compact aside { padding: 12px 6px; }.resize-window aside { width: 40px; flex: 0 0 40px; }.resize-narrow { max-width: 130px; margin: 0 auto; }


/* Keep navigation usable with ten fixed sections and expanded component groups. */
.dsd-nav { overflow-y: auto; min-height: 0; }
.display-grid + .display-status { margin-top: 12px; }
.display-item .display-points { margin-top: 8px; }
.required-missing { margin: 12px 0; color: var(--text-2); font-size: 13px; line-height: 1.8; }
.display-item-head h4 { font-weight: 600; }
#sec-overview .display-group > h3 { font-size: 16px; font-weight: 600; }

/* Component groups: regular weight, independent disclosure controls. */
.dsd-nav .dsd-sub button.sub-h, .dsd-nav .dsd-sub button.sub-h.on { font-weight:400; display:flex; align-items:center; justify-content:space-between; width:100%; }
.nav-category { flex-shrink:0; }
.nav-category-items { display:flex; flex-direction:column; gap:2px; }
.nav-category-items[hidden], .ct-table[hidden] { display:none !important; }
.category-chevron { display:inline-flex; align-items:center; margin-left:auto; flex-shrink:0; }
.category-chevron .ic { width:14px; height:14px; transition:transform .15s; }
[aria-expanded="false"] > .category-chevron .ic { transform:rotate(-90deg); }
.ct-group-toggle { width:100%; text-align:left; background:transparent; cursor:pointer; font-weight:400; font-size:15px; }
.ct-group-toggle:hover { background:var(--fill-1); }
.ct-group-toggle:focus-visible, .sub-h:focus-visible { outline:2px solid var(--brand); outline-offset:-2px; }
.dsd-nav { max-height:calc(100vh - 230px); }
.dsd-nav > button, .dsd-nav > .nav-grp { flex-shrink:0; }
.nav-category, .nav-category-items { min-width:0; max-width:100%; }

/* Nested component navigation follows the same item rhythm as the fixed sections. */
.dsd-nav .dsd-sub { margin-top:16px; gap:16px; }
.nav-category { display:flex; flex-direction:column; gap:16px; }
.nav-category-items { gap:16px; }
.dsd-nav .dsd-sub button, .dsd-nav .dsd-sub button.sub-h, .dsd-nav .dsd-sub button.sub-h.on { height:38px; line-height:38px; font-size:14px; font-weight:400; color:var(--text-primary); margin-top:0; }
.dsd-nav .dsd-sub button[data-cmp].on { color:var(--brand); background:var(--brand-08); font-weight:400; }
.ct-name .nm .component-name-cn, .ct-name .nm .component-name-en { display:block; }
.component-name-cn { font-size:15px; line-height:22px; font-weight:500; }
.component-name-en { font-size:13px; line-height:20px; font-weight:400; color:var(--text-2); margin-top:4px; }


/* 独立版：去掉 Demo 外壳后的少量补充 */
.ct-row{grid-template-columns:clamp(150px,16vw,240px) minmax(0,1fr)!important}
.ct-preview .cp-frame{min-height:60px}
.unsaid{color:var(--text-3)}
.dsd-meta .src{color:var(--text-secondary)}
.overview-markdown h2{margin:28px 0 12px;font-size:20px;line-height:1.5}
.overview-markdown h3{margin:18px 0 6px;font-size:16px;line-height:1.6}
.overview-markdown p{margin:8px 0}
.sw-sub{margin:4px 0 8px;font-size:12px;color:var(--text-secondary)}
.ds-fail{max-width:640px;margin:80px auto;padding:24px 28px;border:1px solid var(--border-1,#e5e5e5);border-radius:8px;font-size:14px;line-height:1.8;background:#fff}
.ds-fail b{font-size:16px}.ds-fail code{padding:1px 4px;background:rgba(0,0,0,.05);border-radius:4px}
/* 预览格：变体 / 预览 / 状态（控件直接放在预览区上下，沿用 Demo 的 seg-sm 页签样式） */
.pvx{padding:16px 20px 18px}

.pvx-seg{flex-wrap:wrap}

.pvx-dflt{height:30px;display:inline-flex;align-items:center;padding:0 14px;border-radius:999px;background:var(--fill-3);color:var(--text-3)}
.pvx-stage{margin:0 0 14px}

/* 左侧导航：整栏可滚动，展开组件列表后也能看到下方的 Pattern */
.dsd-nav{max-height:calc(100% - 24px);overflow-y:auto;scrollbar-width:thin}

/* 栏目数据无法解析时的提示 */
.ds-sec-fail{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;padding:16px 20px;color:var(--text-2)}
.ds-sec-fail b{color:var(--text-1);font-weight:500}

/* 组件 ↔ Pixso 映射第三列：仅在 ct-table-map（design-system.json 带 mapping 键）时三列 */
.ct-table-map .ct-row{grid-template-columns:clamp(150px,13vw,240px) minmax(0,1fr) clamp(200px,16vw,280px)!important}
.ct-table-map .ct-th>div:nth-child(3),.ct-table-map .ct-row>div:nth-child(3){border-left:1px solid var(--border-1)}

.ct-map-src{font-size:12px;line-height:20px;height:20px;color:var(--text-3);margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct-map-preview{width:100%;height:auto;border-radius:8px;display:block;background:#F5F6F8}
.ct-map.none{height:100%;align-items:center;justify-content:center}
.ct-map.none .ct-map-h b{color:var(--text-3);font-weight:400}

/* ── 组件↔Pixso 映射编辑模式（EDIT=true，展示端 #/design-system/{slug}/edit 进入；其余栏目与查看页完全一致）── */
.ct-table-edit .ct-row{grid-template-columns:clamp(150px,13vw,240px) minmax(0,1fr) clamp(200px,16vw,280px) 96px!important}
.ct-table-edit .ct-row>div:nth-child(4){border-left:1px solid var(--border-1)}
.ct-table-edit .ct-th>div{padding:12px 16px;font-size:13px;color:var(--text-2);background:var(--fill-3);font-weight:500}
.ct-table-edit .ct-row>div{padding:14px 16px}
.ct-op{display:flex;align-items:center;justify-content:center}
.ct-op button{border:0;background:transparent;color:var(--brand);font-size:13px;cursor:pointer;padding:0}
.ct-op button:hover{text-decoration:underline}
.ct-name .nm .component-zh{font-size:12px;color:var(--text-3);margin-left:6px;font-weight:400}
/* 编辑区头按钮（关键设计组件） */
.sec-tools .btn-em{height:32px;padding:0 16px;border-radius:999px;background:var(--brand);color:#fff;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;border:0;font-weight:500;white-space:nowrap}
/* 弹窗（向导 760×576 / 编辑组件 809×617，Pixso 节点实测） */
.em-mask{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.42);display:flex;align-items:center;justify-content:center;animation:em-fade .15s}
@keyframes em-fade{from{opacity:0}to{opacity:1}}
.em-dlg{background:#fff;border-radius:16px;width:min(760px,94vw);height:min(576px,92vh);display:flex;flex-direction:column;box-shadow:0 12px 32px rgba(0,0,0,.14)}
.em-dlg-edit{width:min(809px,94vw);min-height:617px;border-radius:8px}
.em-dlg-head{display:flex;align-items:center;justify-content:space-between;height:26px;padding:24px 24px 0;flex-shrink:0;font-size:18px}
.em-dlg-edit .em-dlg-head{box-sizing:border-box;padding:0 24px;margin-top:24px}
.em-dlg-head .t{font-size:18px;font-weight:600;color:var(--text-primary,#191919)}
.em-dlg-x{width:28px;height:28px;border:0;background:transparent;border-radius:6px;color:var(--text-3);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.em-dlg-x svg{width:20px;height:20px}
.em-dlg-x:hover{background:var(--fill-1);color:var(--text-1)}
.em-dlg-body{padding:16px 24px 8px;overflow:auto;min-height:0;flex:1}
.em-dlg-body-flex{display:flex;flex-direction:column;overflow:hidden}
.em-dlg-foot{display:flex;align-items:center;gap:4px;padding:0 24px 20px;flex-shrink:0;background:#FFFFFF}
.em-dlg-foot .spacer{margin-left:auto}
.em-dlg-err{color:#D92D20;font-size:14px;margin-right:auto}
.em-btn{width:88px;height:32px;border-radius:999px;border:1px solid transparent;background:rgba(25,25,25,0.05);color:var(--text-1);font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.em-btn:not(.em-btn-primary):hover{background:rgba(25,25,25,0.1)}
.em-picker .em-btn:not(.em-btn-primary),.em-dlg-edit .em-btn:not(.em-btn-primary){border:1px solid #C9C9C9;background:#FFFFFF;color:#191919}
.em-btn:disabled{opacity:.45;cursor:not-allowed}
.em-btn-primary{background:#0A59F7;border-color:#0A59F7;color:#fff}
.em-btn-primary:hover{background:#3B7BF9;border-color:#3B7BF9;color:#fff}
/* 向导：选择规范（左右两栏，设计稿 容器72338 实测） */
.em-wiz-search{display:flex;align-items:center;gap:6px;border:0;background:rgba(25,25,25,.05);border-radius:999px;height:38px;padding:0 16px;color:var(--text-3);flex-shrink:0}
.em-wiz-search input{border:0;outline:0;font-size:14px;flex:1;background:transparent;color:var(--text-1)}
.em-wiz-search input::placeholder{color:rgba(0,0,0,.6)}
.em-wiz-cols{margin-top:12px;flex:1;min-height:0;display:grid;grid-template-columns:216px minmax(0,1fr)}
.em-dom-list{overflow:auto;padding:6px 8px}
.em-dom-item{width:100%;display:block;text-align:left;border:0;background:transparent;border-radius:8px;padding:9px 12px;font-size:14px;color:var(--text-1);cursor:pointer}
.em-dom-item:hover{background:var(--fill-1)}
.em-dom-item.on{background:var(--brand-08);color:var(--brand);font-weight:500}
.em-tree{overflow-y:auto;min-height:0;padding:6px;scrollbar-width:thin}
.em-tree-grp{width:100%;display:flex;align-items:center;gap:8px;border:0;background:transparent;border-radius:8px;height:40px;padding-right:10px;cursor:pointer;color:var(--text-1);text-align:left}
.em-tree-grp:hover{background:var(--fill-1)}
.em-tree-chev{width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-2);flex-shrink:0}
.em-tree-chev svg{width:14px;height:14px;display:block}
.em-tree-grp:not(.open) .em-tree-chev{transform:rotate(-90deg)}
.em-tree-name{font-size:14px;font-weight:500;color:var(--text-primary,#191919);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.em-tree-grp .em-tree-cnt{margin-left:auto;font-size:14px;color:var(--text-3);flex-shrink:0}
.em-tree-kids[hidden]{display:none}
.em-tree-leaf{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;border-radius:8px;min-height:44px;margin:2px 0;padding-left:16px;padding-right:16px;cursor:pointer;text-align:left}
.em-tree-leaf:hover{background:var(--fill-1)}
.em-tree-leaf.sel{background:var(--fill-1)}
.em-tree-leaf .em-check{color:#000000;margin-left:auto;display:inline-flex;flex-shrink:0}
.em-lib-ic{width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.em-lib-ic svg{width:24px;height:24px;display:block}
.em-lib-txt{min-width:0;flex:1}
.em-lib-name{display:block;font-size:14px;color:var(--text-primary,#191919);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.em-wiz-empty{padding:40px 0;text-align:center;color:var(--text-3);font-size:14px}
/* 向导：关联中 */
.em-matching{margin:auto;display:flex;flex-direction:column;align-items:center;gap:14px}
.em-spinner{width:36px;height:36px;border-radius:50%;border:3px solid var(--border-1);border-top-color:var(--brand);animation:em-spin .9s linear infinite}
@keyframes em-spin{to{transform:rotate(360deg)}}
.em-matching .t{font-size:14px;color:var(--text-primary,#191919);font-weight:500}
.em-matching .s{font-size:14px;color:#777777}
/* 向导：已匹配 */
.em-sel-lib{display:flex;align-items:center;gap:10px;border-radius:10px;padding:10px 14px;margin-bottom:2px}
.em-sel-lib-name{display:block;font-size:14px;font-weight:500;color:var(--text-primary,#191919)}
.em-sel-lib-meta{display:block;font-size:12px;color:var(--text-3);margin-top:2px}
.em-tabs{display:flex;gap:2px;justify-content:center}
.em-tabs button{border:0;background:transparent;font-size:14px;color:var(--text-2);padding:8px 12px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.em-tabs button.on{color:var(--brand);font-weight:500;border-bottom-color:var(--brand)}
.em-rt{margin-top:16px;display:flex;flex-direction:column;min-height:0}
.em-rt-body{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin}
.em-rt-tr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr)}
.em-rt-tr>div{padding:9px 14px;min-width:0;font-size:14px}
.em-rt-tr.em-th{background:var(--fill-3);color:var(--text-2);font-size:14px;height:54px;align-items:center;border:1px solid var(--border-1);border-top-left-radius:10px;border-top-right-radius:10px}
.em-rt-tr.em-row{border-top:1px solid var(--border-1);height:54px;align-items:center;border-left:1px solid var(--border-1);border-right:1px solid var(--border-1)}
.em-rt-tr.em-row:first-child{border-top:0}
.em-rt-tr.em-row:last-child{border-bottom:1px solid var(--border-1);border-bottom-left-radius:10px;border-bottom-right-radius:10px}
.em-rt-name{color:#777777;font-weight:500}
.em-rt-name .zh{color:var(--text-3);font-weight:400;margin-left:6px;font-size:14px}
.em-rt-pname{color:#777777;word-break:break-all}
.em-rt-none{color:#777777}
.em-st{display:inline-flex;align-items:center;gap:5px;font-size:14px}
.em-st.ok{color:var(--brand);gap:16px}
.em-st.miss{color:#FFBB33;gap:16px}
.em-st.miss svg{width:16px;height:16px}

.em-form-row{display:grid;grid-template-columns:1fr 1fr;gap:0 21px;margin-bottom:16px}
.em-form label{display:block}
.em-form .cap{display:block;font-size:14px;color:var(--text-primary,#191919);margin-bottom:8px}
.em-form input{width:100%;height:32px;border:0;background:#F3F3F3;border-radius:4px;padding:0 12px;font-size:13px;color:var(--text-primary,#191919);outline:0}
.em-form input:focus{box-shadow:inset 0 0 0 1px var(--brand)}
.em-form input:disabled{background:#F3F3F3;color:var(--text-3);cursor:not-allowed}
/* 选择设计组件区块 */
.em-pick-sec{margin-bottom:24px}
.em-pick-sec .cap{margin-bottom:8px}
.em-pick-btn{width:100%;height:32px;border:1px solid var(--border-1);border-radius:8px;background:#fff;color:var(--text-1);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}

.em-pick-btn svg{width:14px;height:14px;flex-shrink:0}

.em-ro{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:4px;height:319px}

.em-ro-name{font-size:13px;color:var(--text-primary,#191919);font-weight:500;margin-top:6px}
.em-ro-name .zh{color:var(--text-3);font-weight:400;margin-left:6px;font-size:12px}
.em-ro-divider{height:1px;background:var(--border-1);margin:10px 0;position:relative;left:-16px;width:calc(100% + 32px)}
.em-ro-content{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px 0}
.em-ro-content img{max-width:100%;max-height:100%;object-fit:contain}
.em-ro-frame{width:100%;height:100%;min-height:100px;border:0;background:#fff}
.em-ro-empty{font-size:13px;color:var(--text-3);text-align:center}

.em-picker{width:min(809px,94vw);height:min(600px,92vh)}
.em-picker-back{border:0;background:transparent;color:var(--text-2);cursor:pointer;width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;margin-right:8px}
.em-picker-back:hover{background:var(--fill-1);color:var(--text-1)}
.em-picker-list{flex:1;min-height:0;overflow-y:auto;padding:0 4px;scrollbar-width:thin}
.em-picker-cat-node{display:flex;align-items:center;gap:8px;height:36px;line-height:36px;padding:0 12px;border-radius:8px;cursor:pointer;color:var(--text-1);font-size:14px;font-weight:500}
.em-picker-cat-node:hover{background:var(--fill-1)}
.em-picker-cat-node .em-tree-chev{width:14px;height:14px;color:var(--text-2);flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;transition:transform .15s}
.em-picker-cat-node .em-tree-chev svg{width:10px;height:10px;display:block}
.em-picker-cat-node:not(.open) .em-tree-chev{transform:rotate(-90deg)}
.em-picker-cat-count{margin-left:auto;font-size:14px;color:var(--text-3);font-weight:400;flex-shrink:0}
.em-picker-grid{display:grid;grid-template-columns:repeat(auto-fill,175px);gap:12px;justify-content:flex-start;margin:4px 0 12px;padding:0 4px}
.em-picker-card{overflow:hidden;cursor:pointer;position:relative;background:#fff}
.em-picker-thumb{width:175px;height:160px;border-radius:8px;display:flex;align-items:center;justify-content:center;position:relative;background:var(--fill-3);overflow:hidden;margin:0 auto}
.em-picker-thumb img{max-width:100%;max-height:100%;object-fit:contain}
.em-picker-check{position:absolute;right:8px;top:8px;width:20px;height:20px;border-radius:4px;border:1.5px solid #D9D9D9;background:#fff;display:flex;align-items:center;justify-content:center;color:#fff}
.em-picker-card.sel .em-picker-check{background:var(--brand);border-color:var(--brand)}
.em-picker-label{padding:2px 0 0;height:20px;line-height:20px;font-size:13px;color:var(--text-1);text-align:left}
.em-picker-sel{font-size:14px;color:#777777;height:22px;line-height:22px}
.em-picker .em-dlg-head{justify-content:flex-start}
.em-picker .em-picker-back{margin-right:8px}
.em-picker .em-dlg-x{margin-left:auto}
.em-picker-back svg{width:16px;height:16px}
.em-picker .em-wiz-search{margin-bottom:16px}
.em-picker-list *{font-size:12px}
.em-picker-list .em-tree-chev{width:16px;height:16px}
.em-picker-list .em-tree-chev svg{width:10px;height:10px}
.em-picker-item{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:8px;cursor:pointer;color:var(--text-1);font-size:14px}
.em-picker-item:hover{background:var(--fill-1)}
.em-picker-item.sel{background:var(--brand-08)}
.em-picker-item-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.em-picker-item-check{color:var(--brand);flex-shrink:0;display:inline-flex}
.em-picker-item .em-tree-chev{width:14px;height:14px;color:var(--text-2);flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s;border-radius:4px}
.em-picker-item .em-tree-chev:hover{background:var(--fill-1)}
.em-picker-item .em-tree-chev svg{width:10px;height:10px;display:block}
.em-picker-item .em-tree-chev:not(.open){transform:rotate(-90deg)}
.em-picker-item .em-tree-spacer{width:14px;height:14px;flex-shrink:0}
.em-picker-variant{display:flex;align-items:center;height:32px;padding:0 12px 0 44px;font-size:14px;color:var(--text-3);cursor:pointer;border-radius:6px}
.em-picker-variant:hover{background:var(--fill-1)}
.em-picker-variant-name{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.em-picker-tree{margin:0 0 16px;padding:0 0 0 20px}

 ["color","spacing","radius","shadow","other","typography"].forEach(c=>{const gs=(T[c]||{}).groups;if(Array.isArray(gs))gs.forEach(g=>{if(!g||g.variantOf||!Array.isArray(g.tokens))return;
